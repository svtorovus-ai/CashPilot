name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.CASH_PILOT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing CASH_PILOT_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cashpilot-release.jks"

      - name: Build signed release APK
        env:
          CASH_PILOT_KEYSTORE_PATH: ${{ runner.temp }}/cashpilot-release.jks
          CASH_PILOT_KEYSTORE_PASSWORD: ${{ secrets.CASH_PILOT_KEYSTORE_PASSWORD }}
          CASH_PILOT_KEY_ALIAS: ${{ secrets.CASH_PILOT_KEY_ALIAS }}
          CASH_PILOT_KEY_PASSWORD: ${{ secrets.CASH_PILOT_KEY_PASSWORD }}
        run: |
          test -n "$CASH_PILOT_KEYSTORE_PASSWORD" || { echo "Missing CASH_PILOT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$CASH_PILOT_KEY_ALIAS" || { echo "Missing CASH_PILOT_KEY_ALIAS"; exit 1; }
          test -n "$CASH_PILOT_KEY_PASSWORD" || { echo "Missing CASH_PILOT_KEY_PASSWORD"; exit 1; }
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare update manifest
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          APK=app/build/outputs/apk/release/app-release.apk
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$SHA256" "$REPOSITORY" <<'PY'
          import json
          import sys
          version_code, version_name, sha256, repository = sys.argv[1:]
          data = {
              "versionCode": int(version_code),
              "versionName": version_name,
              "sha256": sha256,
              "apkUrl": f"https://github.com/{repository}/releases/latest/download/CashPilot-release.apk",
              "releaseUrl": f"https://github.com/{repository}/releases/latest",
          }
          with open("update.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)
          PY
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashPilot-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CashPilot ${{ steps.metadata.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
          overwrite_files: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
